    const nxt=c.slice(pos+1).concat(c.slice(0,pos)).find(y=>!used.has(y.x.id)); if(nxt){ sb.list[i]=Object.assign({},x,{id:nxt.x.id,n:nxt.x.n,rest:nxt.x.rest||x.rest,comp:nxt.comp}) } else sb.msg="Pas d'autre exercice disponible pour "+x.m+" avec ce matériel."; render(); return }
  if(t.id==="sbStart"){ sbPersist(true); return }
  if(t.id==="sbSave"){ sbPersist(false); return }
  if(t.dataset.custdel){ const id=t.dataset.custdel.slice(2), c=state.customs[id]; if(!c) return; if(!t.dataset.sure){ t.dataset.sure="1"; t.textContent="Confirmer"; return } const d=Object.assign({},c,{archived:true}); state.customs[id]=d; putDoc("customs",id,d); customsKey=""; render(); return }
  if(t.dataset.goalset){ setNewGoal(t.dataset.goalset); return }
  if(t.id==="goalSave"){ const el=document.getElementById("goal-new"); if(el&&el.value) setNewGoal(el.value); return }
  if(t.dataset.sesscat){ state.sessCat=t.dataset.sesscat; cv.open=""; cv.msg=""; render(); return }
  if(t.dataset.cnew){ const [cat,ty]=t.dataset.cnew.split("|"), id=uid(); cSaveActs(state.sel,a=>a.push({id,cat,t:ty,ts:Date.now(),plan:(CARDIO[ty]&&CARDIO[ty].iv)?(ty==="sprints"?Object.assign({},IV_PRESETS[6]):Object.assign({},IV_PRESETS[2])):undefined}));
    state.sessCat=cat; cv.open=id; cv.msg=""; render(); toTop(); return }
  if(t.dataset.copen){ cv.open=t.dataset.copen; cv.msg=""; render(); toTop(); return }
  if(t.dataset.cclose){ cv.open=""; cv.msg=""; cStopTick(); keepAwake(false); render(); return }
  if(t.dataset.cgo){ const [k,id,cat]=t.dataset.cgo.split("|"); state.sel=k; state.tab="seance"; state.sessCat=cat; cv.open=id; render(); toTop(); return }
  if(t.dataset.cmode!=null){ const e=cCur(); if(!e) return; cUpd(e.id,{mode:t.dataset.cmode||null,plan:e.plan||(t.dataset.cmode==="iv"?Object.assign({},IV_PRESETS[2]):undefined)}); render(); return }
  if(t.dataset.cpreset!=null){ const e=cCur(), P=IV_PRESETS[+t.dataset.cpreset]; if(e) cUpd(e.id,{plan:{reps:P.reps,wu:P.wu,wv:P.wv,rv:P.rv,n:P.n}}); render(); return }
  if(t.id==="cIvStart"){ const e=cCur(); if(!e) return; const P=cReadIv(); cUpd(e.id,{plan:P,live:{start:Date.now()+C_CD,pausedTotal:0,marks:[],skips:[]}}); cLastPh=""; beep(1,1); render(); return }
  if(t.id==="cLiveStart"){ const e=cCur(); if(!e) return; cUpd(e.id,{live:{start:Date.now()+C_CD,pausedTotal:0,laps:[]}}); render(); return }
  if(t.id==="cLap"){ const e=cCur(); if(!e||!e.live) return; const el=Math.round(cElapsed(e.live)), L=e.live.laps||[]; if(el<0||(L.length&&el-L[L.length-1]<3000)) return; cUpd(e.id,x=>({live:Object.assign({},x.live,{laps:L.concat([el])})})); render(); return }
  if(t.id==="cLapUndo"){ const e=cCur(); if(!e||!e.live) return; cUpd(e.id,x=>({live:Object.assign({},x.live,{laps:(x.live.laps||[]).slice(0,-1)})})); render(); return }
  if(t.id==="cPause"){ const e=cCur(); if(!e||!e.live) return; cUpd(e.id,x=>{ const L=Object.assign({},x.live); if(L.pausedAt){ L.pausedTotal=(L.pausedTotal||0)+(Date.now()-L.pausedAt); delete L.pausedAt } else L.pausedAt=Date.now(); return {live:L} }); render(); return }
  if(t.id==="cStop"){ const e=cCur(); if(!e||!e.live) return; cUpd(e.id,x=>{ const L=Object.assign({},x.live); if(L.pausedAt){ L.pausedTotal=(L.pausedTotal||0)+(Date.now()-L.pausedAt); delete L.pausedAt } L.stoppedAt=Date.now(); L.ended=true; return {live:L} }); cStopTick(); keepAwake(false); render(); return }
  if(t.id==="cRepDone"){ const e=cCur(); if(!e) return; const S=ivState(e); if(S.ph!=="work"||S.since<2000) return; const el=Math.round(cElapsed(e.live)); cUpd(e.id,x=>{ const L=Object.assign({},x.live), m=(L.marks||[]).slice(); m[S.i]=el; L.marks=m; return {live:L} }); render(); return }
  if(t.id==="cSkipRest"){ const e=cCur(); if(!e) return; const S=ivState(e); if(S.ph!=="rest") return; const el=Math.round(cElapsed(e.live)); cUpd(e.id,x=>{ const L=Object.assign({},x.live), m=(L.skips||[]).slice(); m[S.i]=el; L.skips=m; return {live:L} }); render(); return }
  if(t.dataset.crpe){ const e=cCur(); if(!e) return; const v=+t.dataset.crpe; cUpd(e.id,Object.assign(cReadForm(e),{rpe:e.rpe===v?null:v})); render(); return }
  if(t.id==="cSave"){ const e=cCur(); if(!e) return; const p=cReadForm(e), w=cCheck(e,p);
    if(!p.dur){ cv.msg=w[0]; render(); return }
    if(w.length&&cv.warnFor!==e.id){ cv.warnFor=e.id; cv.msg=w.join(" ")+" Appuie à nouveau sur Enregistrer si c'est juste."; cUpd(e.id,p); render(); return }
    cv.warnFor=null; const S=e.mode==="iv"&&e.live&&e.live.start?ivState(e):null;
    cUpd(e.id,x=>{ const o=Object.assign({},p,{done:true,doneAt:Date.now()}); if(x.live&&!x.live.ended){ const L=Object.assign({},x.live); if(L.pausedAt){ L.pausedTotal=(L.pausedTotal||0)+(Date.now()-L.pausedAt); delete L.pausedAt } L.ended=true; L.stoppedAt=S&&S.ph==="end"?L.start+(L.pausedTotal||0)+S.end:Date.now(); o.live=L } return o });
    cv.msg="Séance enregistrée."; render(); return }
  if(t.dataset.cdel){ if(!t.dataset.sure){ t.dataset.sure="1"; t.textContent="Confirmer la suppression"; return } const id=t.dataset.cdel; cSaveActs(state.sel,a=>{ const i=a.findIndex(x=>x.id===id); if(i>=0) a.splice(i,1) }); cv.open=""; cStopTick(); keepAwake(false); render(); return }
  if(t.id==="wodStart"){ const b=sessionBody(); const sc=(document.getElementById("wod-scale")||{}).value||"strictes"; b.wod={v:1,start:Date.now()+WOD_COUNTDOWN,rounds:[],pausedTotal:0,scale:sc}; save("sessions",state.sel,b); flushAll(); state.wodStopAsk=false; render(); return }
  if(t.id==="wodCancel"){ const b=sessionBody(); delete b.wod; save("sessions",state.sel,b); flushAll(); keepAwake(false); render(); return }
  if(t.id==="wodRound"){ const b=sessionBody(), w=b.wod, cfg=wodCfg(b.type); if(!w||wodPhase(w,cfg)!=="running") return; const e=Math.round(wodElapsed(w)), rt=w.rounds||[];
    if(rt.length&&e-rt[rt.length-1]<3000) return; w.rounds=rt.concat([e]); wodSave(w); render(); return }
  if(t.id==="wodUndo"){ const b=sessionBody(), w=b.wod; if(!w||!(w.rounds||[]).length) return; w.rounds=w.rounds.slice(0,-1); wodSave(w); render(); return }
  if(t.id==="wodPause"){ const b=sessionBody(), w=b.wod; if(!w) return; if(w.pausedAt){ w.pausedTotal=(w.pausedTotal||0)+(Date.now()-w.pausedAt); delete w.pausedAt } else w.pausedAt=Date.now(); wodSave(w); render(); return }
  if(t.id==="wodStop"){ if(!state.wodStopAsk){ state.wodStopAsk=true; render(); return } const b=sessionBody(), w=b.wod; if(!w) return; w.stoppedAt=Math.round(wodElapsed(w)); w.stopped=true; if(w.pausedAt){ w.pausedTotal=(w.pausedTotal||0)+(Date.now()-w.pausedAt); delete w.pausedAt } state.wodStopAsk=false; wodSave(w); render(); return }
  if(t.dataset.wodpart){ const [id,d]=t.dataset.wodpart.split("|"), b=sessionBody(), w=b.wod, cfg=wodCfg(b.type), m=cfg.moves.find(x=>x.id===id); w.partial=Object.assign({},w.partial||{}); w.partial[id]=Math.max(0,Math.min(m.r,(num(w.partial[id])||0)+ +d)); wodSave(w); render(); return }
  if(t.id==="wodFinish"){ wodFinish(); return }
  if(t.id==="wodReopen"){ const b=sessionBody(), w=Object.assign({},b.wod); w.final=false; delete w.result; b.wod=w; b.done=false; save("sessions",state.sel,b); flushAll(); render(); return }
  if(t.id==="sessPick"){ state.sesspick=!state.sesspick; state.sesspickWarn=null; render(); return }
  if(t.dataset.pickses!=null){ const nt=t.dataset.pickses, b=sessionBody();
    const logged=Object.entries(b.ex||{}).some(([,e])=>e&&(e.sets||[]).some(x=>num(x.r)!=null||num(x.kg)!=null));
    if(logged&&b.type&&nt!==b.type&&state.sesspickWarn!==nt){ state.sesspickWarn=nt; render(); return }
    b.type=nt; save("sessions",state.sel,b); state.sesspick=false; state.sesspickWarn=null; render(); toTop(); return }
  if(t.id==="markDone"){ const b=sessionBody(); if(!b.type){return} b.done=!b.done; b.updated=Date.now(); if(b.done&&state.sel===todayKey()&&b.startedAt) b.endedAt=Date.now(); if(!b.done) delete b.endedAt; save("sessions",state.sel,b); render(); return }
});
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{state.tab=b.dataset.tab;render();toTop()}));
document.getElementById("prev").addEventListener("click",()=>{state.sel=addDays(state.sel,-1);render()});
document.getElementById("next").addEventListener("click",()=>{state.sel=addDays(state.sel,1);render()});
document.getElementById("goToday").addEventListener("click",()=>{state.sel=todayKey();render()});

/* Fit the app to the part of the screen that is actually visible (iOS can make the page taller than the screen). */
function fitScreen(){
  const vv=window.visualViewport, cs=getComputedStyle(document.documentElement);
  const pad=(parseFloat(cs.paddingTop)||0)+(parseFloat(cs.paddingBottom)||0);
  let h=Math.min(vv?vv.height:window.innerHeight, window.innerHeight);
  h=Math.max(320,Math.round(h-pad));
  const cur=parseFloat(document.body.style.height)||0;
  if(Math.abs(cur-h)>2) document.body.style.height=h+"px";
  if(document.documentElement.scrollTop) document.documentElement.scrollTop=0;
  if(document.body.scrollTop) document.body.scrollTop=0;
}
fitScreen();
window.addEventListener("resize",fitScreen);
window.addEventListener("orientationchange",()=>setTimeout(fitScreen,300));
if(window.visualViewport){ visualViewport.addEventListener("resize",fitScreen) }
setTimeout(fitScreen,500);

render();
runTimer();
connect();
initSample();
})();
</script>
