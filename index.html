/* ---------- storage (db capability, one write at a time per doc) ---------- */
const timers={}, inflight={}, dirty={}, base={};
function clone(x){ return x==null?x:JSON.parse(JSON.stringify(x)) }
function isObj(x){ return x&&typeof x==="object"&&!Array.isArray(x) }
/* patch minimal entre la dernière version connue du serveur et la version locale ; null = champ supprimé */
/* le stockage garde un champ mis à null au lieu de le supprimer : on nettoie à la lecture */
function stripNulls(x){ if(Array.isArray(x)) return x.map(v=>isObj(v)?stripNulls(v):v); if(!isObj(x)) return x; const o={}; Object.keys(x).forEach(k=>{ const v=x[k]; if(v===null||v===undefined) return; o[k]=isObj(v)||Array.isArray(v)?stripNulls(v):v }); return o }
function hasDel(p){ return Object.keys(p).some(k=>p[k]===null||(isObj(p[k])&&hasDel(p[k]))) }
function diffPatch(a,b){
  const out={}; a=a||{}; b=b||{};
  new Set([...Object.keys(a),...Object.keys(b)]).forEach(k=>{
    if(!(k in b)||b[k]===undefined){ if(a[k]!=null) out[k]=null; return }
    if(isObj(a[k])&&isObj(b[k])){ const sub=diffPatch(a[k],b[k]); if(Object.keys(sub).length) out[k]=sub; return }
    if(JSON.stringify(a[k])!==JSON.stringify(b[k])) out[k]=clone(b[k]);
  });
  return out;
}
function save(coll,k,body){
  const store=state[coll==="days"?"days":"sessions"], path0=coll+"/"+k;
  if(!(path0 in base)) base[path0]=clone(store[k]||null);
  store[k]=body;
  const path=coll+"/"+k;
  clearTimeout(timers[path]);
  timers[path]=setTimeout(()=>{delete timers[path];flush(path)},400);
}
const waiting=new Set();
function flushAll(){ Object.keys(timers).forEach(p=>{clearTimeout(timers[p]);delete timers[p];flush(p)}) }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") flushAll() });
window.addEventListener("pagehide",flushAll);
document.addEventListener("focusout",e=>{ if(e.target&&e.target.closest&&e.target.closest("#app")) flushAll() });
async function flush(path){
  if(!state.db){ waiting.add(path); return }
  if(inflight[path]){dirty[path]=true;return}
  const [coll,k]=path.split("/");
  const body=(coll==="days"?state.days:state.sessions)[k];
  inflight[path]=true;
  try{
    if(body){
      const prev=base[path];
      if(prev==null){ await state.db.doc(path).set(clone(body)) }
      else{
        const patch=diffPatch(prev,body);
        if(Object.keys(patch).length&&hasDel(patch)){ await state.db.doc(path).set(clone(body)) }
        else if(Object.keys(patch).length){
          try{ await state.db.doc(path).update(patch) }
          catch(e){ if(e&&e.code==="invalid_argument") await state.db.doc(path).set(clone(body)); else throw e }
        }
      }
      base[path]=clone(body);
    }
  }
  catch(e){ showSaveError(e) }
  finally{ inflight[path]=false; if(dirty[path]){dirty[path]=false;flush(path)} }
}
function showSaveError(e){

}

async function connect(){
  const timeout=setTimeout(()=>{ if(state.status==="loading"){state.status="slow";render()} },10000);
  let db=null;
  try{ db = window.claude && window.claude.use ? await window.claude.use("db") : null }catch(e){ db=null }
  if(!db){ clearTimeout(timeout); state.status="offline"; render(); return }
  state.db=db;
  waiting.forEach(p=>flush(p)); waiting.clear();
  let got=0;
  const onColl=(coll)=>snap=>{
    snap.docs.forEach(d=>{
      const path=coll+"/"+d.id;
      if(timers[path]||inflight[path]) return;
      const data=d.exists?stripNulls(d.data()):undefined;
      (coll==="days"?state.days:state.sessions)[d.id]=data; base[path]=clone(data||null);
    });
    snap.docChanges().forEach(c=>{ if(c.type==="removed") delete (coll==="days"?state.days:state.sessions)[c.doc.id] });
    if(!snap.metadata.fromCache){ got++; if(got>=2){clearTimeout(timeout); state.status="ready"} }
    else if(state.status==="loading") state.status="cache";
    safeRender();
  };
  const onErr=e=>{ clearTimeout(timeout); state.status="error"; safeRender() };
  db.collection("days").onSnapshot(onColl("days"),onErr);
  db.collection("sessions").onSnapshot(onColl("sessions"),onErr);
  db.collection("settings").onSnapshot(snap=>{
    snap.docs.forEach(d=>{ if(d.id==="swaps"&&d.exists&&!settingsBusy) state.settings=d.data()||{}; if(d.id==="profile"&&d.exists&&!profileBusy){ state.profile=d.data()||{}; applyProfile() } });
    safeRender();
  },()=>{});
  db.collection("bodychecks").onSnapshot(snap=>{
    snap.docs.forEach(d=>{ if(d.exists) state.bodychecks[d.id]=d.data() });
    snap.docChanges().forEach(c=>{ if(c.type==="removed") delete state.bodychecks[c.doc.id] });
    safeRender();
  },()=>{});
  EXTRA_COLLS.forEach(c=>{ db.collection(c).onSnapshot(snap=>{
      snap.docs.forEach(d=>{ if(d.exists) state[c][d.id]=stripNulls(d.data()) });
      snap.docChanges().forEach(ch=>{ if(ch.type==="removed") delete state[c][ch.doc.id] });
      state.loaded[c]=true; if(c==="backups") setTimeout(autoBackup,4000); safeRender();
    },()=>{ state.loaded[c]=true }) });
  db.collection("planning").onSnapshot(snap=>{
    snap.docs.forEach(d=>{ if(d.exists) state.planning[d.id]=d.data() });
    snap.docChanges().forEach(c=>{ if(c.type==="removed") delete state.planning[c.doc.id] });
    safeRender();
  },()=>{});
}
function safeRender(){

/* ---------- derived ---------- */
function weekRange(w){const s=weekStart(w);return [...Array(7)].map((_,i)=>addDays(s,i))}
function weekSum(k,field){const w=weekOf(k);if(!w)return 0;return weekRange(w).reduce((s,d)=>s+(num(day(d)[field])||0),0)}
function rollingAvg(k){const vals=[];for(let i=0;i<7;i++){const w=num(day(addDays(k,-i)).weight);if(w!=null)vals.push(w)}return avg(vals)}
function lastSets(exId,before){
  const keys=Object.keys(state.sessions).filter(k=>k<before).sort().reverse();
  for(const k of keys){const s=state.sessions[k];if(!s||!s.ex)continue;
    for(const [slot,e] of Object.entries(s.ex)){ if(e&&!e.wod&&(e.alt||slot)===exId&&e.sets&&e.sets.some(x=>num(x.r)!=null)) return {k,e} } }
  return null;
}

/* ---------- coach : proposition de charge selon la dernière séance (double progression) ---------- */
function parseTarget(t){
  const m=String(t).match(/(\d+)×(\d+)(?:–(\d+))?/);
  if(/max/.test(t)) return {sets:+((t.match(/(\d+)×/)||[])[1]||3),min:null,max:null,max_:true};
  if(!m) return null;
  return {sets:+m[1],min:+m[2],max:+(m[3]||m[2]),time:/\d\s*s\b/.test(t)};
}
function kgStep(info,kg){
  if(info.id==="tractions-assist") return -5;
  if(["presse","hack","pendulum","belt-squat","mollets-presse","squat-hammer"].includes(info.id)) return 5;
  if(info.eq==="haltères") return kg<10?1:2;
  return 2.5;
}
function r1(x){return Math.round(x*4)/4}
function suggest(ex,info,last){
  const tg=parseTarget(ex.t); if(!last||!tg) return null;
  const done=(last.e.sets||[]).filter(x=>num(x.r)!=null).map(x=>({r:num(x.r),kg:num(x.kg)||0}));
  if(!done.length) return null;
  const n=tg.sets, work=done.slice(0,n);
  const lastR=i=>(done[i]||done[done.length-1]).r;
  // gainage / exercices en secondes : +5 s
  if(info.time||tg.time){ return {kg:null,reps:[...Array(n)].map((_,i)=>lastR(i)+5),msg:"Ajoute 5 secondes sur chaque série."} }
  const top=Math.max(...work.map(x=>x.kg));
  const allTop=work.length>=n&&work.every(x=>Math.abs(x.kg-top)<0.01);
  // séries "max" (tractions) : battre la dernière fois d'une répétition
  if(tg.max_){ return {kg:top||null,reps:[...Array(n)].map((_,i)=>lastR(i)+1),msg:"Fais 1 répétition de plus que la dernière fois sur chaque série."} }
  const rirs=(last.e.sets||[]).slice(0,n).map(x=>num(x.rir)).filter(x=>x!=null), rirAvg=rirs.length?rirs.reduce((a,b)=>a+b,0)/rirs.length:null;
  const validated=allTop&&work.every(x=>x.r>=tg.max);
  if(validated&&rirAvg!=null&&rirAvg<=0.5&&!info.bw){ return {kg:top||null,reps:Array(n).fill(tg.max),msg:`${n}×${tg.max} validé, mais à l'échec (RIR ${fmt(rirAvg,1)}) : refais la même charge avec 1 répétition en réserve avant de monter.`} }
  if(!validated&&rirAvg!=null&&rirAvg>=4&&!(work.length<n||work.some(x=>x.r<tg.min))&&!info.bw&&!tg.time&&!info.time){ const nk=r1(top+kgStep(info,top)); return {kg:nk,reps:Array(n).fill(tg.min),msg:`Il te restait environ ${fmt(rirAvg,0)} répétitions en réserve : la charge est trop légère, passe à ${kgTxt(nk)} kg.`} }
  if(validated){
    if(info.bw&&!top&&tg.max>=10&&info.id!=="tractions-assist"){
      return {kg:2.5,reps:Array(n).fill(tg.min),msg:`${n}×${tg.max} validé : ajoute 2,5 kg de lest et reviens à ${tg.min} répétitions.`} }
    if(info.bw&&!top){ return {kg:null,reps:Array(n).fill(tg.max+1),msg:`${n}×${tg.max} validé : vise ${tg.max+1} répétitions.`} }
    const step=kgStep(info,top), nk=r1(Math.max(0,top+step));
    const txt=info.id==="tractions-assist"?`retire ${Math.abs(step)} kg d'assistance`:`passe à ${fmt(nk,nk%1?(nk*2%1?2:1):0)} kg`;
    return {kg:nk,reps:Array(n).fill(tg.min),msg:`${n}×${tg.max} validé la dernière fois : ${txt}${tg.min<tg.max?` et repars à ${tg.min} répétitions`:""}.`};
  }
  const missed=work.length<n||work.some(x=>x.r<tg.min);
  const reps=[...Array(n)].map((_,i)=>Math.min(tg.max,Math.max(tg.min,(work[i]?work[i].r:tg.min)+(tg.min<tg.max?1:0))));
  if(missed) return {kg:top||null,reps:Array(n).fill(tg.min),msg:`Pas encore ${n}×${tg.min} à ${top?fmt(top,top%1?1:0)+" kg":"cette charge"} : garde la même charge et va chercher toutes les répétitions.`};
  return {kg:top||null,reps,msg:tg.min<tg.max?`Même charge : ajoute 1 répétition par série jusqu'à ${n}×${tg.max}, puis la charge montera.`:`Même charge : vise ${n}×${tg.max} partout pour monter la prochaine fois.`};
}
function kgTxt(x){return x==null?"":String(x).replace(".",",")}

function setsText(e,ex){return e.sets.filter(x=>num(x.r)!=null).map(x=>{const r=num(x.r),kg=num(x.kg);if(ex&&ex.time)return r+" s";return (kg!=null&&kg>0?fmt(kg,kg%1?1:0)+" kg × ":"")+r}).join(" · ")}
function weekStats(w){
  const days=weekRange(w);
  const weights=days.map(d=>num(day(d).weight));
  const kcal=days.map(d=>eatenOf(day(d))).filter(x=>x!=null);
  const protDays=days.filter(d=>(num(day(d).prot)||0)>=T.prot).length;
  const protLogged=days.filter(d=>num(day(d).prot)!=null).length;
  const steps=days.map(d=>num(day(d).steps)).filter(x=>x!=null);
  const done=days.filter(d=>sess(d)&&sess(d).done).length;
  const planned=days.filter(d=>plannedType(d)).length;
  return {w,days,avgW:avg(weights),kcal:avg(kcal),protDays,protLogged,steps:avg(steps),
    alcohol:days.reduce((s,d)=>s+(num(day(d).alcohol)||0),0),
    fastfood:days.reduce((s,d)=>s+(num(day(d).fastfood)||0),0),done,planned};
}

let HEIGHT=178, AGE=25;
function weightAt(k){ const ks=Object.keys(state.days).filter(x=>x<=k&&num(state.days[x].weight)!=null).sort(); return ks.length?num(state.days[ks[ks.length-1]].weight):START_WEIGHT }
function alcKcal(){ return (state.profile&&num(state.profile.alcKcal))||140 }
/* calories mangées = repas saisis + verres d'alcool du compteur */
function eatenOf(d){ const k=num(d.kcal), a=num(d.alcohol)||0; if(k==null&&!a) return null; return Math.round((k||0)+a*alcKcal()) }
function sessionMinutes(k,type){
  const s=sess(k); if(s&&s.wod&&s.wod.final&&s.startedAt&&s.endedAt) return Math.max(1,Math.round((s.endedAt-s.startedAt-(s.wod.pausedTotal||0))/60000)); if(s&&s.startedAt&&s.endedAt){ const m=Math.round((s.endedAt-s.startedAt)/60000); if(m>=15&&m<=180) return m } const p=planOf(k); if(p&&p.session&&p.session.type===type){ const m=hm(p.session.e)-hm(p.session.s); if(m>0) return m } return type==="cal"?45:60 }
function energy(k){
  const d=day(k), w=weightAt(k), s=sess(k);
  const bmr=Math.round(10*w+6.25*HEIGHT-5*AGE+SEXK);
  const stepsIn=num(d.steps), steps=stepsIn!=null?stepsIn:4000;
  const neat=Math.round(steps*w*0.0005);
  const eaten=eatenOf(d);
  const tef=eaten!=null?Math.round(eaten*0.1):0;
  const lines=[];
  if(s&&s.done&&s.type){ const min=sessionMinutes(k,s.type), met=(PROGRAM[s.type]&&PROGRAM[s.type].met)||(s.type==="cal"?3.8:3.5);
    lines.push({auto:true,n:"Séance "+PROGRAM[s.type].name,min,met,kcal:Math.round((met-1)*w*min/60)}) }
  let stepsInActs=0;
  (d.acts||[]).forEach(a=>{ let kc=Math.round((a.met-1)*w*a.min/60), dup=0;
    if(a.phone&&stepsIn!=null){ const est=Math.min(stepsIn-stepsInActs, actSteps(a)*a.min); if(est>0){ dup=Math.round(est*w*0.0005); stepsInActs+=est } }
    lines.push({id:a.id,n:a.n,min:a.min,met:a.met,kcal:kc-dup,dup}) });
  const used={n:stepsInActs}; cEnergyLines(k,w,stepsIn,used).forEach(l=>lines.push(l));
  const sport=lines.reduce((x,l)=>x+l.kcal,0);
  const cf=calibFactor(), adj=Math.round((bmr+neat)*(cf-1));
  return {w,bmr,steps,stepsIn,neat,eaten,tef,lines,sport,adj,calib:cf,total:bmr+neat+adj+tef+sport};
}

/* pas estimés par minute pendant une activité (téléphone ou montre sur soi) */
function actSteps(a){ const n=norm(a.n||""), c=a.c||"";
  if(/course|footing|trail|sprint|orientation/.test(n)) return 160;
  if(/marche|randonnee|promener|escaliers/.test(n)) return 105;
  if(c==="Sports collectifs"||/foot|basket|hand|rugby/.test(n)) return 65;
  if(c==="Raquettes"||/padel|tennis|squash|badminton/.test(n)) return 55;
  if(/danse|golf/.test(n)) return 40;
  return 0 }
function calibFactor(){ const c=num((state.profile||{}).calib); return c&&c>0.7&&c<1.3?c:1 }

function applySwap(slot,id,name){
  const b=sessionBody(); const cur=b.ex[slot]=b.ex[slot]||{sets:[]};
  if(id===slot){ delete cur.alt; delete cur.altName } else { cur.alt=id; if(name) cur.altName=name; else delete cur.altName }
  if(!b.type) b.type=plannedType(state.sel)||"";
  save("sessions",state.sel,b);
  if(swap.keep&&ALL_EX[slot]){ const st=JSON.parse(JSON.stringify(state.settings||{})); st.swaps=st.swaps||{}; st.custom=st.custom||{};
    if(id===slot) delete st.swaps[slot]; else st.swaps[slot]=id;
    if(name) st.custom[id]=name;
    state.settings=st; saveSettings() }
  else if(name){ const st=JSON.parse(JSON.stringify(state.settings||{})); st.custom=st.custom||{}; st.custom[id]=name; state.settings=st; saveSettings() }
  swap.open=""; swap.q=""; render();
}
let settingsBusy=false, settingsDirty=false;
async function saveSettings(){
  if(!state.db) return;
  if(settingsBusy){settingsDirty=true;return}
  settingsBusy=true;
  try{ await state.db.doc("settings/swaps").set(JSON.parse(JSON.stringify(state.settings))) }catch(e){ showSaveError(e) }
  finally{ settingsBusy=false; if(settingsDirty){settingsDirty=false;saveSettings()} }
}

function chartSVG(){
  const keys=Object.keys(state.days).filter(k=>num(state.days[k].weight)!=null).sort();
  if(!keys.length) return `<p class="empty">Ta courbe apparaîtra dès ta première pesée.</p>`;
  const W=640,H=240,L=40,R=12,Tp=12,B=28;
  const gs=goalStart(), x0=keys[0]<START?keys[0]:START, lastK=keys[keys.length-1]>todayKey()?keys[keys.length-1]:todayKey(), x1=addDays(lastK,21), span=Math.max(1,diffDays(x0,x1));
  const ws=keys.map(k=>num(state.days[k].weight));
  let lo=Math.floor(Math.min(GOAL,...ws)-0.5), hi=Math.ceil(Math.max(START_WEIGHT,...ws)+0.5);
  const X=k=>L+(W-L-R)*diffDays(x0,k)/span, Y=v=>Tp+(H-Tp-B)*(hi-v)/(hi-lo);
  let g="";
  const step=(hi-lo)>8?2:1;
  for(let v=lo;v<=hi;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`}
  // month ticks
  let m=parseKey(x0); m=new Date(m.getFullYear(),m.getMonth()+1,1,12);
  while(keyOf(m)<=x1){const k=keyOf(m);g+=`<text x="${X(k)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${new Intl.DateTimeFormat("fr-FR",{month:"short"}).format(m)}</text>`;m=new Date(m.getFullYear(),m.getMonth()+1,1,12)}
  // target trajectory + goal
  { const dir=Math.sign(GOAL-START_WEIGHT), rate=dir<0?0.5:0.25; if(dir){ const days=Math.abs(START_WEIGHT-GOAL)/rate*7, tEnd=addDays(gs,Math.round(days)); const kEnd=tEnd<x1?tEnd:x1, wEnd=START_WEIGHT+dir*rate*diffDays(gs,kEnd)/7;
    g+=`<line x1="${X(gs)}" y1="${Y(START_WEIGHT)}" x2="${X(kEnd)}" y2="${Y(wEnd)}" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1"/>` } }
  g+=`<line x1="${L}" x2="${W-R}" y1="${Y(GOAL)}" y2="${Y(GOAL)}" stroke="var(--good)" stroke-width="1.5"/><text x="${W-R}" y="${Y(GOAL)-5}" text-anchor="end" font-size="11" fill="var(--good)">objectif ${GOAL} kg</text>`;
  // points
  g+=keys.map(k=>`<circle cx="${X(k)}" cy="${Y(num(state.days[k].weight))}" r="2.6" fill="var(--muted)" opacity=".6"/>`).join("");
  // rolling average line
  const pts=keys.map(k=>[X(k),Y(rollingAvg(k))]);
  if(pts.length>1) g+=`<polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`;
  const lp=pts[pts.length-1]; g+=`<circle cx="${lp[0]}" cy="${lp[1]}" r="4.5" fill="var(--accent)"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe du poids et moyenne sur 7 jours">${g}</svg>
  <span class="meta">Points : pesées · ligne pleine : moyenne 7 jours · pointillés : rythme repère de ${GOAL<START_WEIGHT?"0,5 kg perdu":"0,25 kg pris"} par semaine depuis ${fmt(START_WEIGHT)} kg.</span>`;
}

function goalStart(){ return (state.profile&&state.profile.goalStart)||START }
function goalState(){
  const t=todayKey(), dir=Math.sign(GOAL-START_WEIGHT);
  const recent=[...Array(10)].map((_,i)=>num(day(addDays(t,-i)).weight)).filter(x=>x!=null);
  const lastK=Object.keys(state.days).filter(k=>num(state.days[k].weight)!=null).sort().pop();
  const avg7=lastK?rollingAvg(lastK):null;
  const reached=dir!==0&&avg7!=null&&recent.length>=3&&(dir<0?avg7<=GOAL:avg7>=GOAL);
  return {dir,avg7,reached,weighIns:recent.length};
}

function verdicts(){
  const out=[]; const t=todayKey(); const cw=weekOf(t);
  if(cw<1){ out.push(["",`Le Winter Arc démarre le ${startTxt()}. Pèse-toi ce matin-là pour fixer ton point de départ.`]); return out }
  const full=[]; for(let w=1;w<cw;w++) full.push(weekStats(w));
  const withW=full.filter(s=>s.avgW!=null);
  if(withW.length>=3){
    const a=withW.slice(-3).map(s=>s.avgW);
    if(a[1]-a[0]>=-0.05&&a[2]-a[1]>=-0.05) out.push(["bad","Ta moyenne ne baisse plus depuis 2 semaines. Retire 150 kcal par jour."]);
  }
  if(withW.length>=2){
    const d=withW[withW.length-1].avgW-withW[withW.length-2].avgW;
    if(d<-1) out.push(["warn",`Tu as perdu ${fmt(-d)} kg en une semaine : trop rapide, tu risques d'y laisser du muscle. Ajoute environ 150 kcal.`]);
    else if(d<=-0.2) out.push(["good",`${fmt(d)} kg sur la dernière semaine : rythme dans la cible.`]);
  }
  const last=full[full.length-1];
  if(last){
    if(last.done<last.planned) out.push([last.done<=last.planned-2?"bad":"warn",`Semaine ${last.w} : ${last.done}/${last.planned} séances. La régularité est ton point faible, ne le laisse pas s'installer.`]);
    else out.push(["good",`Semaine ${last.w} : toutes les séances faites.`]);
    if(last.protLogged&&last.protDays<5) out.push(["warn",`Protéines atteintes ${last.protDays} jours sur 7 la semaine dernière. Vise 6 minimum.`]);
    if(last.alcohol>T.alcoholWeek) out.push(["bad",`${last.alcohol} verres d'alcool la semaine dernière, pour une limite de ${T.alcoholWeek}.`]);
    if(last.fastfood>T.fastfoodWeek) out.push(["warn",`${last.fastfood} fast-foods la semaine dernière, pour une limite de ${T.fastfoodWeek}.`]);
  }
  if(!out.length) out.push(["","Pas encore assez de données pour un bilan. Il apparaîtra après ta première semaine complète."]);
  return out;
}

/* charge réellement déplacée : poids du corps + lest, ou poids du corps − assistance */
function loadOf(ex,kg,k){ if(ex.id==="tractions-assist") return Math.max(0,weightAt(k)-kg); if(ex.bw) return weightAt(k)+kg; return kg }
function e1rm(ex,kg,r,k){ return loadOf(ex,kg,k)*(1+r/30) }   // formule d'Epley
function setLabel(ex,kg,r){ if(ex.time) return r+" s"; if(ex.id==="tractions-assist") return "assistance "+fmt(kg,kg%1?1:0)+" kg × "+r; if(ex.bw) return (kg?"PdC + "+fmt(kg,kg%1?1:0)+" kg":"PdC")+" × "+r; return fmt(kg,kg%1?1:0)+" kg × "+r }
function records(){
  const best={};
  Object.keys(state.sessions).sort().forEach(k=>{const s=state.sessions[k];if(!s||!s.ex)return;
    Object.entries(s.ex).forEach(([slot,e])=>{ if(!e||e.skip||e.wod) return; const id=e.alt||slot;(e.sets||[]).forEach(x=>{const r=num(x.r),kg=num(x.kg)||0;if(r==null||r<=0)return;
      const ex=exInfo(id,e);
      const score=ex.time?r:e1rm(ex,kg,r,k);
      if(!best[id]||score>best[id].score) best[id]={score,r,kg,k};
    })})});
  const rows=Object.entries(best).map(([id,b])=>{const ex=exInfo(id);
    return `<tr><td>${esc(ex.n)}</td><td>${esc(setLabel(ex,b.kg,b.r))}</td><td>${ex.time?"–":fmt(b.score,0)+" kg"}</td><td>${fmtShort.format(parseKey(b.k))}</td></tr>`}).join("");
  return rows?`<div class="tablewrap"><table><thead><tr><th>Exercice</th><th>Meilleure série</th><th>1RM estimé</th><th>Date</th></tr></thead><tbody>${rows}</tbody></table></div>`:`<p class="empty">Tes records s'afficheront après ta première séance enregistrée.</p>`;
}

function mondayOf(k){ const d=parseKey(k), w=(d.getDay()+6)%7; return addDays(k,-w) }
function weekBilan(mon){
  const days=[...Array(7)].map((_,i)=>addDays(mon,i)), today=todayKey();
  let burned=0, eaten=0, logged=0, sessions=0, prot=[], steps=[], weights=[], water=0, alc=0, ff=0, sport=0;
  days.forEach(k=>{
    if(k>today) return;
    const d=day(k), E=energy(k), kc=eatenOf(d);
    if(kc!=null&&k<today){ logged++; eaten+=kc; burned+=E.total }
    sport+=E.sport;
    if(sess(k)&&sess(k).done) sessions++;
    if(num(d.prot)!=null) prot.push(num(d.prot));
    if(num(d.steps)!=null) steps.push(num(d.steps));
    if(num(d.weight)!=null) weights.push(num(d.weight));
    water+=num(d.glasses)||0; alc+=num(d.alcohol)||0; ff+=num(d.fastfood)||0;
  });
  const planned=days.filter(k=>plannedType(k)).length;
  return {mon,sun:days[6],days,burned,eaten,logged,balance:logged?Math.round(eaten-burned):null,sessions,planned,prot:avg(prot),protDays:prot.filter(x=>x>=T.prot).length,steps:avg(steps),weight:avg(weights),water,alc,ff,sport,current:days.includes(today)};
}

  if((num(d.glasses)||0)>25) w.push(`${num(d.glasses)} verres d'eau : vérifie.`);

/* ---------- calibration de la dépense à partir du poids réel ---------- */
function slopeOf(pts){ const n=pts.length; if(n<2) return 0; const mx=avg(pts.map(p=>p.x)), my=avg(pts.map(p=>p.y)); let a=0,b=0; pts.forEach(p=>{a+=(p.x-mx)*(p.y-my); b+=(p.x-mx)**2}); return b?a/b:0 }
function calibration(){
  const end=addDays(todayKey(),-1), start=addDays(end,-27);
  const ws=[], logged=[];
  for(let k=start;k<=end;k=addDays(k,1)){
    const d=day(k), w=num(d.weight); if(w!=null) ws.push({x:diffDays(start,k),y:w});
    const e=eatenOf(d); if(e!=null&&num(d.kcal)!=null){ const E=energy(k); logged.push({eat:e,base:E.bmr+E.neat,other:E.tef+E.sport}) }
  }
  const span=ws.length?ws[ws.length-1].x-ws[0].x:0;
  const st={weigh:ws.length,span,logged:logged.length,needWeigh:8,needLogged:20,needSpan:14};
  st.ok=ws.length>=8&&span>=14&&logged.length>=20;
  if(!st.ok) return st;
  const slope=slopeOf(ws);                      // kg par jour
  const intake=avg(logged.map(x=>x.eat)), base=avg(logged.map(x=>x.base)), other=avg(logged.map(x=>x.other));
  const observed=intake-slope*7700;            // dépense réelle déduite
  let factor=(observed-other)/base; factor=Math.max(0.8,Math.min(1.2,factor));
  return Object.assign(st,{slopeWeek:slope*7,intake:Math.round(intake),model:Math.round(base*calibFactor()+other),observed:Math.round(observed),factor:Math.round(factor*100)/100});
}
function calibHTML(){
  const c=calibration(), cur=calibFactor();
  let body;
  if(!c.ok) body=`<p class="meta" style="margin:0">Pas encore assez de données pour mesurer ta vraie dépense. Il faut, sur les 4 dernières semaines : au moins 8 pesées sur 14 jours (tu en as ${c.weigh}, sur ${c.span} jours) et 20 jours avec tes calories saisies (tu en as ${c.logged}). D'ici là, la dépense affichée reste une estimation par formules.</p>`;
  else body=`<div class="todo">
      <div class="td"><span></span><span class="t">Tendance de poids</span><span class="v">${c.slopeWeek>0?"+":""}${fmt(c.slopeWeek,2)} kg / semaine</span><span></span></div>
      <div class="td"><span></span><span class="t">Calories mangées (moyenne)</span><span class="v">${c.intake.toLocaleString("fr-FR")} kcal</span><span></span></div>

    <p class="meta" style="margin:0">Facteur proposé : ×${String(c.factor).replace(".",",")} sur ton métabolisme de base et ta vie quotidienne. Les variations d'eau (sel, créatine, glucides) peuvent fausser la tendance sur peu de semaines.</p>
    ${Math.abs(c.factor-cur)>=0.02?`<button class="btn" data-calib="${c.factor}">Appliquer ×${String(c.factor).replace(".",",")}</button>`:`<span class="pill good">Calibration à jour</span>`}`;
  return `<section class="card"><h2>Calibration de ta dépense</h2>
    <span class="meta">Facteur actuel : ${cur===1?"aucun (formules standard)":"×"+String(cur).replace(".",",")}</span>${body}
    ${cur!==1?`<button class="btn ghost" data-calib="1">Revenir aux formules standard</button>`:""}</section>`;
}

function barChart(items,o){
  o=o||{}; if(!items.length) return "";

/* séries par muscle sur une période [from, to] */
function muscleVolume(from,to){
  const out={}; MUSCLES.forEach(m=>out[m]={direct:0,indirect:0,eff:0,days:new Set(),rir:[]});
  Object.entries(state.sessions).forEach(([k,s])=>{ if(k<from||k>to||!s||!s.ex) return;
    Object.entries(s.ex).forEach(([slot,e])=>{ if(!e||e.skip) return; const id=e.alt||slot, n=doneSets(e); if(!n.length) return;
      musclesOf(id).forEach(([m,w])=>{ const o=out[m]; if(!o) return;

}

  const t=todayKey(), nd=Math.min(28,diffDays(START,t)+1); if(nd<14) return {lbl:"pas assez de recul",cls:"",ratio:null};
  const a=muscleVolume(addDays(t,-6),t)[m].eff, c=muscleVolume(addDays(t,-(nd-1)),t)[m].eff/(nd/7);

const REC_FIELDS=[["sleepQ","Qualité du sommeil","mauvaise","excellente"],["fatigue","Fatigue","aucune","épuisé"],["doms","Courbatures","aucune","fortes"],["stress","Stress","calme","très stressé"],["motiv","Motivation","nulle","au top"]];
function recScore(r){
  if(!r) return null;
  const h=num(r.sleepH), parts=[];
  const sh=h==null?null:h>=7.5?100:h>=7?85:h>=6?60:h>=5?35:15;
  const inv=v=>v==null?null:(5-v)*25, dir=v=>v==null?null:(v-1)*25;
  const comp=[["Durée du sommeil",sh,30,h!=null?fmt(h,1)+" h":"non saisie"],["Qualité du sommeil",dir(num(r.sleepQ)),15,r.sleepQ?r.sleepQ+"/5":"–"],
    ["Fatigue",inv(num(r.fatigue)),20,r.fatigue?r.fatigue+"/5":"–"],["Courbatures",inv(num(r.doms)),15,r.doms?r.doms+"/5":"–"],
    ["Stress",inv(num(r.stress)),10,r.stress?r.stress+"/5":"–"],["Motivation",dir(num(r.motiv)),10,r.motiv?r.motiv+"/5":"–"]];
  let tot=0,wsum=0; comp.forEach(([l,v,w,txt])=>{ if(v!=null){ tot+=v*w; wsum+=w } parts.push({l,v,w,txt}) });
  if(!wsum) return null;
  const score=Math.round(tot/wsum), pain=num(r.pain)||0;
  let advice;
  if(score>=75) advice="Bonne récupération : séance normale, garde 1 à 2 répétitions en réserve.";
  else if(score>=55) advice="Récupération correcte : séance normale, mais garde 2 à 3 répétitions en réserve.";
  else if(score>=40) advice="Récupération moyenne : allège la séance (une série de moins par exercice, 3 répétitions en réserve).";
  else advice="Récupération faible : séance très légère ou repos actif (marche, mobilité). Priorité au sommeil ce soir.";
  const painTxt=pain>=3?`Douleur notée ${pain}/5${r.painZone?" ("+r.painZone+")":""} : évite les exercices qui la réveillent. Si elle persiste plusieurs jours, est vive ou s'accompagne d'un gonflement, consulte un professionnel de santé.`:"";
  return {score,parts,advice,painTxt,cls:score>=75?"good":score>=55?"acc":score>=40?"warn":"bad"};
}

/* =====================  PLANIFICATION  ===================== */
function targetOf(slot,def){ const o=((state.settings||{}).targets||{})[slot]; return o||def }
/* séance adaptée au temps disponible */
function planForTime(type,minutes,k){
  const p=PROGRAM[type]; const s=sess(k)||{}; const ex=(s.ex)||{};
  const items=p.ex.map((se,i)=>{ const cur=ex[se.id]||{}; const eid=effId(se.id,cur), info=exInfo(eid,cur), tg=parseTarget(targetOf(se.id,se.t))||{sets:3};
    const iso=["fly","tri","bi","bi_n","lat","rear","ext","curl_leg","calf","core","core_lat"].includes((LIB[eid]||{}).pat);
    return {slot:se.id,n:info.n,sets:tg.sets,rest:info.rest,iso,order:i,skip:false} });
  const cost=it=>it.skip?0:it.sets*(40+it.rest)/60+1.5;
  const total=()=>8+items.reduce((a,it)=>a+cost(it),0);   // 8 min d'échauffement
  let guard=40;
  while(total()>minutes&&guard--){
    const red=items.filter(it=>!it.skip&&it.sets>2).sort((a,b)=>(b.iso-a.iso)||(b.order-a.order))[0];
    if(red){ red.sets--; continue }
    const drop=items.filter(it=>!it.skip).sort((a,b)=>(b.iso-a.iso)||(b.order-a.order))[0];
    if(!drop||items.filter(it=>!it.skip).length<=2) break; drop.skip=true;
  }
  let extra=null;
  if(minutes>=75){
    const t=todayKey(), vol=muscleVolume(addDays(t,-13),t);
    const mus=[...new Set(items.flatMap(it=>musclesOf(effId(it.slot,ex[it.slot]||{})).filter(x=>x[1]>=1).map(x=>x[0])))];
    const low=mus.sort((a,b)=>vol[a].eff-vol[b].eff)[0];
    const cand=Object.values(LIB).find(x=>musclesOf(x.id).some(m=>m[0]===low&&m[1]>=1)&&["fly","tri","bi","lat","rear","ext","curl_leg","calf","core"].includes(x.pat)&&!items.some(it=>effId(it.slot,ex[it.slot]||{})===x.id));
    if(cand) extra={id:cand.id,n:cand.n,t:"3×12",muscle:low};
  }
  return {items,extra,total:Math.round(total()+(extra?3*(40+exInfo(extra.id).rest)/60+1.5:0))};
}
const tplan={min:null};
function timePlanHTML(type,k){
  const chips=`<div class="chips">${[30,45,60,75].map(m=>`<button class="chip ${tplan.min===m?"on":""}" data-tmin="${m}">${m} min</button>`).join("")}</div>`;
  if(!tplan.min) return `<div class="tplan"><span class="lbl">Adapter la séance à mon temps</span>${chips}</div>`;
  const pl=planForTime(type,tplan.min,k);
  return `<div class="tplan"><span class="lbl">Adapter la séance à mon temps</span>${chips}
    <ul class="plain">${pl.items.map(it=>`<li>${it.skip?`<s>${esc(it.n)}</s> <span class="meta">retiré</span>`:`${esc(it.n)} : <b>${it.sets} séries</b>`}</li>`).join("")}${pl.extra?`<li>+ ${esc(pl.extra.n)} : <b>3×12</b> <span class="meta">(${pl.extra.muscle}, ton muscle le moins travaillé sur 2 semaines)</span></li>`:""}</ul>
    <span class="meta">Durée estimée : environ ${pl.total} min, échauffement compris. On garde d'abord les exercices principaux ; l'isolation perd des séries en premier.</span>
    <div class="row"><button class="btn" data-tapply="${tplan.min}">Appliquer à la séance du jour</button><button class="btn ghost" data-tmin="0">Annuler</button></div></div>`;
}
function applyTimePlan(minutes){
  const k=state.sel, b=sessionBody(); const type=b.type||plannedType(k); if(!type) return;
  b.type=type; const pl=planForTime(type,minutes,k);
  pl.items.forEach(it=>{ const e=b.ex[it.slot]=b.ex[it.slot]||{sets:[]}; if(it.skip){ e.skip=true } else { delete e.skip; e.n=it.sets; if(e.sets&&e.sets.length>it.sets) e.sets=e.sets.slice(0,it.sets) } });
  if(pl.extra){ b.extra=(b.extra||[]).slice(); const id="e-"+uid(); const lastSlot=pl.items.filter(i=>!i.skip).slice(-1)[0];
    b.extra.push({id,after:lastSlot?lastSlot.slot:"",t:"3×12"}); b.ex[id]={alt:pl.extra.id,sets:[],n:3} }
  save("sessions",k,b); tplan.min=null; render();
}
/* séance prévue manquée récemment */
function missedSession(){
  const t=todayKey(); if(plannedType(t)||(sess(t)&&sess(t).type)) return null;
  for(let i=1;i<=2;i++){ const k=addDays(t,-i), pt=plannedType(k), s=sess(k);
    if(pt&&!(s&&s.done)){ const doneSince=[...Array(i)].some((_,j)=>{ const s2=sess(addDays(t,-j)); return s2&&s2.done }); if(!doneSince) return {k,type:pt} } }
  return null;
}

const PROP_FIELDS={kcalMin:[1500,3200,"Calories min"],kcalMax:[1600,3500,"Calories max"],prot:[100,260,"Protéines (g)"],steps:[3000,20000,"Pas"],glasses:[6,20,"Eau, jour de repos"],glassesTrain:[6,24,"Eau, jour de séance"],alcoholWeek:[0,14,"Alcool par semaine"],fastfoodWeek:[0,7,"Fast-food par semaine"]};
function validProp(p){
  if(!p||typeof p!=="object") return false;
  if(p.type==="cible"){ const f=PROP_FIELDS[p.champ], v=num(p.valeur); return !!f&&v!=null&&v>=f[0]&&v<=f[1] }
  if(p.type==="remplacement") return !!ALL_EX[p.slot]&&!!LIB[p.exercice];
  if(p.type==="objectif_series") return !!ALL_EX[p.slot]&&/^\d×\d+(–\d+)?( s)?$/.test(String(p.cible||"").replace("x","×").replace("-","–"));
  if(p.type==="seance_du_jour") return Array.isArray(p.exercices)&&p.exercices.length>=2&&p.exercices.length<=10&&p.exercices.every(e=>LIB[e.id]);
  return false;
}
function propLabel(p){
  if(p.type==="cible") return `${PROP_FIELDS[p.champ][2]} : ${T[p.champ]??"–"} → ${p.valeur}`;
  if(p.type==="remplacement") return `Remplacer « ${exInfo(effId(p.slot,{})).n} » par « ${LIB[p.exercice].n} » dans les prochaines séances`;
  if(p.type==="objectif_series") return `${ALL_EX[p.slot].n} : ${targetOf(p.slot,ALL_EX[p.slot].t)} → ${p.cible}`;
  if(p.type==="seance_du_jour") return `Séance du jour : ${p.exercices.map(e=>LIB[e.id].n+" "+(e.cible||"3×10")).join(", ")}`;
  return "";
}

  if(p.type==="objectif_series"){ const st=clone(state.settings||{}); st.targets=st.targets||{}; const old=targetOf(p.slot,ALL_EX[p.slot].t); const c=String(p.cible).replace("x","×").replace("-","–"); st.targets[p.slot]=c; state.settings=st; saveSettings(); logChange("Objectif de séries : "+ALL_EX[p.slot].n,old,c,src) }

    PROGRAM[type].ex.forEach(se=>{ const e=b.ex[se.id]=b.ex[se.id]||{sets:[]}; if(!doneSets(e).length) e.skip=true });
    b.extra=(b.extra||[]).slice(); let after="";

    save("sessions",k,b); logChange("Séance du jour remplacée par le coach",PROGRAM[type].name,p.exercices.length+" exercices",src) }
  p.statut="appliquée"; await putDoc("coachlog",role,log); render();
}

async function askCoach(q){
  q=String(q||"").trim(); if(!q||coach.busy) return;
  if(!meal.sample){ coach.err="Le coach IA n'est pas disponible dans cette version de l'appli. Les alertes et analyses ci-dessous restent calculées sans IA."; render(); return }
  const role=roleOf(coach.role); coach.busy=true; coach.err=""; coach.pending=q; render();
  const log=state.coachlog[role.id]||{msgs:[]};
  const hist=log.msgs.slice(-3).map(m=>"Q : "+m.q+"\nR : "+(m.a&&m.a.reponse||"")).join("\n\n");
  const prompt=`Tu es le coach ${role.n} de Winter Arc, l'application de suivi de ${userName()}. ${role.brief}
Objectif actuel de ${userName()} : passer de ${START_WEIGHT} à ${GOAL} kg en gardant ou en gagnant du muscle (recomposition). Le Winter Arc a commencé le ${startTxt()} et n'a pas de date de fin.

Règles absolues :
1. Appuie-toi uniquement sur les DONNÉES et la BIBLIOTHÈQUE fournies. Si une donnée manque, dis précisément laquelle au lieu de supposer.
2. Ne cite jamais une étude, un auteur, une organisation ou un chiffre scientifique absent des fiches fournies. Pour t'appuyer sur la science, mets les "id" des fiches dans "sources". Si aucune fiche ne couvre la question, dis-le et mets "statut":"avis".
3. Distingue mesures (poids, charges, répétitions, calories saisies) et estimations (dépense, macros estimées, masse grasse sur photo, fatigue).
4. Pas de diagnostic médical ni de surentraînement. Douleur persistante ou symptôme inhabituel : oriente vers un professionnel de santé.
5. Compléments : seulement après avoir examiné son alimentation et ses objectifs ; sache dire qu'un produit est inutile ou déconseillé.
6. Tu ne modifies rien toi-même : tout changement passe par "propositions", que ${userName()} validera ou refusera. Ne propose que ce qui est vraiment justifié par ses données, jamais plus de 3.
7. Tutoiement, ton direct et honnête, sans flatterie ni généralités. 120 à 280 mots, concret, chiffré avec ses données.

${hist?"Échanges précédents :\n"+hist+"\n\n":""}Question de ${userName()} : ${q}

DONNÉES ET BIBLIOTHÈQUE (JSON) :
${coachContext(role)}

Réponds uniquement avec ce JSON :
{"reponse":"texte en paragraphes séparés par \\n\\n","points_cles":["2 à 4 points"],"statut":"consensus|hypothèse|avis|données personnelles","niveau_preuve":"élevé|modéré|faible|insuffisant|sans objet","sources":["ids de fiches utilisées"],"limites":"ce que l'analyse ne permet pas de conclure","donnees_manquantes":["données qui amélioreraient l'analyse"],"propositions":[{"type":"cible","champ":"kcalMin|kcalMax|prot|steps|glasses|glassesTrain|alcoholWeek|fastfoodWeek","valeur":0,"raison":"..."},{"type":"remplacement","slot":"id d'exercice du programme","exercice":"id de la bibliothèque d'exercices","raison":"..."},{"type":"objectif_series","slot":"id d'exercice du programme","cible":"4×8–10","raison":"..."},{"type":"seance_du_jour","exercices":[{"id":"id d'exercice","cible":"3×10"}],"raison":"..."}]}
"propositions" peut être vide. Ids d'exercices du programme : ${Object.keys(ALL_EX).join(", ")}. Ids de la bibliothèque d'exercices : ${Object.keys(LIB).join(", ")}.`;
  coach.ctl=new AbortController();
  try{
    const a=await meal.sample.json(prompt,{signal:coach.ctl.signal,cache:false,modelTier:"default"});
    if(!a||typeof a.reponse!=="string") throw {code:"invalid_json"};
    const ids=new Set(kbList().map(f=>f.id)); const before=(a.sources||[]).length;
    a.sources=(a.sources||[]).filter(x=>ids.has(x)); a.sources_retirees=before-a.sources.length;
    a.propositions=(a.propositions||[]).filter(validProp).slice(0,3).map(p=>Object.assign(p,{statut:"en attente"}));
    log.msgs=log.msgs.concat([{q,a,ts:Date.now()}]).slice(-20);
    await putDoc("coachlog",role.id,log);
  }catch(e){ if(e&&e.code!=="cancelled") coach.err=MEAL_ERR[e&&e.code]||"Le coach n'a pas pu répondre. Réessaie." }
  coach.busy=false; coach.pending=""; render();
}

function coachAlerts(){
  const t=todayKey(), out=[];
  const weigh=[...Array(7)].filter((_,i)=>num(day(addDays(t,-i)).weight)!=null).length;
  if(weigh<3) out.push({cls:"warn",t:`${weigh} pesée${weigh>1?"s":""} sur les 7 derniers jours`,d:"Il en faut au moins 4 par semaine pour suivre ta tendance et calibrer ta dépense.",go:"jour"});
  const prot=[...Array(7)].map((_,i)=>num(day(addDays(t,-i-1)).prot)).filter(x=>x!=null);
  if(prot.length>=3&&avg(prot)<T.prot-15) out.push({cls:"warn",t:`Protéines : ${Math.round(avg(prot))} g en moyenne sur 7 jours`,d:`Ta cible est ${T.prot} g. Ajoute une prise de ${Math.round(T.prot-avg(prot))} g (shaker, skyr, œufs).`,go:"jour"});
  const w=weekBilan(mondayOf(t)); const missed=w.days.filter(k=>k<t&&plannedType(k)&&!(sess(k)&&sess(k).done)).length;
  if(missed) out.push({cls:"bad",t:`${missed} séance${missed>1?"s":""} prévue${missed>1?"s":""} non faite${missed>1?"s":""} cette semaine`,d:"Décale-la plutôt que de la sauter : l'Accueil te propose de la faire le jour suivant.",go:"seance"});
  const rec=recScore(day(t).rec); if(rec&&rec.score<55) out.push({cls:"warn",t:`Récupération ${rec.score}/100 aujourd'hui`,d:rec.advice,go:"accueil"});
  const st=progressionRows(6).filter(p=>p.stagn); if(st.length) out.push({cls:"warn",t:`${st.length} exercice${st.length>1?"s":""} en stagnation`,d:st.map(p=>p.n).slice(0,3).join(", "),role:"muscu"});
  const legs=Object.keys(state.sessions).sort().reverse().map(k=>state.sessions[k]).find(s=>s&&s.type==="jam"&&s.done);
  if(legs){ const tot=PROGRAM.jam.ex.length, skipped=PROGRAM.jam.ex.filter(se=>legs.ex&&legs.ex[se.id]&&legs.ex[se.id].skip).length; if(skipped>=tot/2) out.push({cls:"bad",t:`Dernière séance jambes : ${skipped} exercices sur ${tot} sautés`,d:"Les jambes sont tes plus gros muscles : c'est là que se joue une grosse partie de ta dépense et de ta recomposition.",go:"seance"}) }
  const c=calibration(); if(c.ok&&Math.abs(c.factor-calibFactor())>=0.03) out.push({cls:"acc",t:"Calibration de ta dépense disponible",d:`Ton poids réel indique un facteur ×${String(c.factor).replace(".",",")}. À valider dans Profil → Réglages.`,psub:"reglages"});
  return out;
}

/* =====================  MOTEUR NUTRITIONNEL (sans IA)  =====================
   Sources : CIQUAL 2025 (Anses, Licence Ouverte 2.0), Open Food Facts (ODbL, cache

["myfoods","offcache","recipes","mealtpl","foodprefs"].forEach(c=>{ if(!EXTRA_COLLS.includes(c)) EXTRA_COLLS.push(c); if(!state[c]) state[c]={} });

/* ---------- constituants ---------- */
const NUTS=[["kcal","Énergie","kcal"],["prot","Protéines","g"],["gl","Glucides","g"],["sug","dont sucres","g"],["li","Lipides","g"],["ags","dont AG saturés","g"],["fi","Fibres","g"],["salt","Sel","g"]];
const NKEYS=NUTS.map(n=>n[0]);
/* index des colonnes CIQUAL (dans le tableau des 74 constituants) */
const CQ={kj:0,kcal:1,water:4,prot:5,prot625:6,gl:7,li:8,sug:9,fi:17,alc:20,ags:22,salt:40};
const MICROS=[[41,"Calcium"],[44,"Fer"],[46,"Magnésium"],[49,"Potassium"],[51,"Sodium"],[52,"Zinc"],[45,"Iode"],[50,"Sélénium"],[53,"Vitamine A (éq. rétinol)"],[56,"Vitamine D"],[60,"Vitamine E"],[63,"Vitamine C"],[64,"Vitamine B1"],[65,"Vitamine B2"],[68,"Vitamine B6"],[69,"Vitamine B9 (folates, DFE)"],[73,"Vitamine B12"],[35,"Oméga-3 ALA"],[37,"Oméga-3 EPA"],[38,"Oméga-3 DHA"],[39,"Cholestérol"]];

const SRC={ciqual:"CIQUAL 2025 (Anses)",off:"Open Food Facts",perso:"Mon aliment",recipe:"Ma recette",ai:"Analyse IA",manuel:"Saisie manuelle"};

/* ---------- normalisation et recherche ---------- */
function nrm(s){ return String(s||"").toLowerCase().replace(/œ/g,"oe").replace(/æ/g,"ae").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim() }
function stem(t){ return t.length>3?t.replace(/(s|x)$/,""):t }
function toks(s){ return nrm(s).split(" ").filter(Boolean).map(stem) }
function stateOf(name){ const n=nrm(name);
  if(/\b(cuit|cuite|cuits|cuites|bouilli|bouillie|grille|grillee|poele|poelee|roti|rotie|vapeur|frit|frite|braise|braisee|au four|saute|sautee|rissole|mijote)\b/.test(n)) return "cuit";
  if(/\b(sec|seche|secs|seches|deshydrate|deshydratee|en poudre|non cuit|non cuite)\b/.test(n)) return "sec";
  if(/\b(cru|crue|crus|crues)\b/.test(n)) return "cru";
  return "" }

/* ---------- valeurs ---------- */
/* cellule CIQUAL -> {v, f} ; f : "t" traces, "lt" inférieur à, null = connu */
function cell(x){ if(x==null) return {v:null}; if(x==="t") return {v:0,f:"traces"}; if(typeof x==="string"&&x[0]==="<") return {v:0,f:"< "+x.slice(1).replace(".",",")}; return {v:x} }
/* kcal calculées à partir des macros (facteurs du règlement UE 1169/2011) quand l'énergie manque */
function kcalFromMacros(v){ if(v.prot==null||v.gl==null||v.li==null) return null; return Math.round((v.prot*4+v.gl*4+v.li*9+(v.fi||0)*2+(v.alc||0)*7)*10)/10 }

const food={cq:null,cqMap:null,loading:false,err:"",idx:null,idxKey:""};
function cqFood(row){
  const vals=row.slice(3), v={}, flags={};
  const take=(k,i)=>{ const c=cell(vals[i]); v[k]=c.v; if(c.f) flags[k]=c.f };
  take("kcal",CQ.kcal); take("prot",CQ.prot); take("gl",CQ.gl); take("li",CQ.li); take("sug",CQ.sug); take("fi",CQ.fi); take("ags",CQ.ags); take("salt",CQ.salt);
  if(v.prot==null){ const c=cell(vals[CQ.prot625]); if(c.v!=null){ v.prot=c.v; flags.prot="N × 6,25" } }
  const alc=cell(vals[CQ.alc]).v;
  let fia="A";
  if(v.kcal==null){ const k=kcalFromMacros(Object.assign({alc},v)); if(k!=null){ v.kcal=k; flags.kcal="calculée à partir des macros"; fia="C" } }
  return {ref:"c:"+row[0],n:row[1],src:"ciqual",fia,unit:"g",state:stateOf(row[1]),grp:(food.cq&&food.cq.grp[row[2]])||"",v,flags,row};
}
function offFood(p){ return {ref:"o:"+p.code,n:p.n||("Produit "+p.code),brand:p.brand||"",src:"off",fia:p.fia||"B",unit:p.unit||"g",state:stateOf(p.n),v:p.v||{},flags:p.flags||{},portion:p.serving?{g:p.serving,lbl:"1 portion"}:null,qty:p.qty||"",ingr:p.ingr||"",code:p.code} }
function persoFood(id,p){ return {ref:"p:"+id,n:p.n,brand:p.brand||"",src:"perso",fia:p.kind==="estimation"?"C":"B",unit:p.unit||"g",state:stateOf(p.n),v:p.v||{},flags:p.flags||{},portion:num(p.portion)?{g:num(p.portion),lbl:p.portionLbl||"1 portion"}:null,code:p.code||"",ingr:p.ingr||""} }
function recipeFood(id,r){ const c=recipeCalc(r); return {ref:"r:"+id,n:r.n,src:"recipe",fia:c.fia,unit:"g",state:"",v:c.per100,flags:c.flags100,portion:c.portionG?{g:c.portionG,lbl:"1 portion"}:null,recipe:r} }
function getFood(ref){
  if(!ref) return null; const t=ref.slice(0,1), id=ref.slice(2);
  if(t==="c"){ const row=food.cqMap&&food.cqMap.get(+id); return row?cqFood(row):null }
  if(t==="o"){ const p=state.offcache[id]; return p?offFood(p):null }
  if(t==="p"){ const p=state.myfoods[id]; return p?persoFood(id,p):null }
  if(t==="r"){ const r=state.recipes[id]; return r?recipeFood(id,r):null }
  return null;
}
/* calcul pour une quantité : valeurs exactes x g / 100, inconnu reste inconnu */
function calcFor(f,g){
  const out={g,unk:[],inc:[]};
  NKEYS.forEach(k=>{ const v=f.v?f.v[k]:null;
    if(v==null){ out[k]=null; out.unk.push(k) }
    else{ out[k]=Math.round(v*g/100*10)/10; if(f.flags&&f.flags[k]==="incomplet") out.inc.push(k) } });
  return out;
}
/* somme d'éléments (aliments d'un repas, ingrédients d'une recette) */
function sumCalc(items){
  const t={n:items.length,unk:{},inc:{}};
  NKEYS.forEach(k=>{ t[k]=0; items.forEach(it=>{ const v=it[k];
    if(v==null){ t.unk[k]=(t.unk[k]||0)+1 } else { t[k]+=v; if((it.inc||[]).includes(k)) t.inc[k]=(t.inc[k]||0)+1 } });
    t[k]=Math.round(t[k]*10)/10; if(items.length&&t.unk[k]===items.length) t[k]=null });
  return t;
}
function worstFia(list){ const o="ABCD"; let w="A"; list.forEach(x=>{ if(o.indexOf(x)>o.indexOf(w)) w=x }); return w }
/* recette : totaux, pour 100 g (sur le poids cuit s'il est connu), par portion */
function recipeCalc(r){
  const ings=(r.ings||[]).map(i=>{ const f=(i.ref&&!i.ref.startsWith("r:")&&getFood(i.ref))||{v:i.v||{},flags:i.flags||{},fia:i.fia||"C"}; const c=calcFor(f,num(i.g)||0); c.fia=f.fia; return c });
  const tot=sumCalc(ings), raw=ings.reduce((a,c)=>a+c.g,0), cooked=num(r.cooked), base=cooked||raw, portions=Math.max(1,num(r.portions)||1);
  const per100={}, flags100={};
  NKEYS.forEach(k=>{ per100[k]=tot[k]==null||!base?null:Math.round(tot[k]/base*100*10)/10; if(tot.unk[k]&&tot[k]!=null) flags100[k]="incomplet" });
  return {tot,raw,cooked,base,portions,portionG:base?Math.round(base/portions):null,per100,flags100,fia:ings.length?worstFia(ings.map(c=>c.fia)):"C",
    perPortion:Object.fromEntries(NKEYS.map(k=>[k,tot[k]==null?null:Math.round(tot[k]/portions*10)/10]))};
}
function fmtN(v,k){ if(v==null) return "?"; return k==="kcal"?String(Math.round(v)):fmt(v,v<10?1:0) }
function nutLine(o,keys){ return (keys||["kcal","prot","gl","li","fi"]).map(k=>{ const n=NUTS.find(x=>x[0]===k); const inc=(o.unk&&(Array.isArray(o.unk)?o.unk.includes(k):o.unk[k]))||(o.inc&&(Array.isArray(o.inc)?o.inc.includes(k):o.inc[k]));
  return `<span class="nv${o[k]==null?" unk":""}"><b>${fmtN(o[k],k)}${inc&&o[k]!=null?"+":""}</b>${k==="kcal"?" kcal":" g"} <i>${n[1].replace("dont ","")}</i></span>` }).join(" ") }

/* ---------- chargement de CIQUAL (fichier publié + cache local) ---------- */
function idbGet(key){ return new Promise(res=>{ try{ const rq=indexedDB.open("wa-food",1); rq.onupgradeneeded=()=>rq.result.createObjectStore("kv"); rq.onsuccess=()=>{ try{ const tx=rq.result.transaction("kv","readonly").objectStore("kv").get(key); tx.onsuccess=()=>res(tx.result||null); tx.onerror=()=>res(null) }catch(e){ res(null) } }; rq.onerror=()=>res(null) }catch(e){ res(null) } }) }
function idbSet(key,val){ try{ const rq=indexedDB.open("wa-food",1); rq.onupgradeneeded=()=>rq.result.createObjectStore("kv"); rq.onsuccess=()=>{ try{ rq.result.transaction("kv","readwrite").objectStore("kv").put(val,key) }catch(e){} } }catch(e){} }
const CQ_FILE="data/ciqual-2025.json", CQ_VER="CIQUAL2025_FR_2025_11_03";
async function loadCiqual(){
  if(food.cq||food.loading) return; food.loading=true;
  let d=window.__CIQUAL||await idbGet(CQ_VER);
  if(!d){ try{ const r=await fetch(CQ_FILE); if(!r.ok) throw new Error("HTTP "+r.status); d=await r.json(); idbSet(CQ_VER,d) }catch(e){ food.err="La base CIQUAL n'a pas pu se charger ("+(e.message||"erreur")+"). Tes aliments personnels, recettes et repas habituels restent utilisables." } }
  if(d){ food.cq=d; food.cqMap=new Map(d.foods.map(r=>[r[0],r])) }
  food.loading=false; food.idx=null; safeRender();
}
/* index de recherche, reconstruit quand la bibliothèque personnelle change */
function buildIdx(){
  const key=[Object.keys(state.myfoods).length,Object.keys(state.offcache).length,Object.keys(state.recipes).length,food.cq?1:0,JSON.stringify(Object.keys(state.recipes).map(k=>state.recipes[k].n)),JSON.stringify(Object.keys(state.myfoods).map(k=>state.myfoods[k].n))].join("|");
  if(food.idx&&food.idxKey===key) return food.idx;
  const idx=[];
  Object.entries(state.recipes).forEach(([id,r])=>idx.push({ref:"r:"+id,n:r.n,t:toks(r.n),src:"recipe"}));
  Object.entries(state.myfoods).forEach(([id,p])=>idx.push({ref:"p:"+id,n:p.n,b:p.brand,t:toks(p.n+" "+(p.brand||"")),src:"perso"}));
  Object.entries(state.offcache).forEach(([id,p])=>idx.push({ref:"o:"+id,n:p.n,b:p.brand,t:toks((p.n||"")+" "+(p.brand||"")),src:"off"}));
  if(food.cq) food.cq.foods.forEach(r=>idx.push({ref:"c:"+r[0],n:r[1],t:toks(r[1]),u:nrm(r[1]).split(" "),st:stateOf(r[1]),src:"ciqual",head:toks(r[1].split(",")[0])}));
  food.idx=idx; food.idxKey=key; return idx;
}
function foodPrefs(){ return state.foodprefs.main||{fav:[],recent:[]} }
function searchFoods(q,limit){
  const STW={cuit:"cuit",cuite:"cuit",cuits:"cuit",cuites:"cuit",cru:"cru",crue:"cru",crus:"cru",crues:"cru",sec:"sec",seche:"sec",seches:"sec",secs:"sec"};
  const raw=nrm(q).split(" ").filter(Boolean), wantSt=raw.map(w=>STW[w]).find(Boolean)||"", qraw=raw.filter(w=>!STW[w]), qt=qraw.map(stem);
  if(!qt.length&&!wantSt) return [];
  const P=foodPrefs(), fav=new Set(P.fav||[]), rec=new Map((P.recent||[]).map((r,i)=>[r.ref,i]));
  const out=[];
  buildIdx().forEach(e=>{
    if(!qt.every(t=>e.t.some(w=>w.startsWith(t)))) return;
    const est=e.st!=null?e.st:stateOf(e.n); if(wantSt&&est!==wantSt) return;
    let s=0; if(e.u) qraw.forEach(w=>{ if(e.u.includes(w)) s+=12 }); if(e.t[0]&&e.t[0].startsWith(qt[0])) s+=30; if(e.head&&qt.every(t=>e.head.some(w=>w.startsWith(t)))) s+=15;
    if(e.src==="recipe"||e.src==="perso") s+=40; if(e.src==="off") s+=25; if(fav.has(e.ref)) s+=60; if(rec.has(e.ref)) s+=35-Math.min(30,rec.get(e.ref));
    if(/aliment moyen/.test(nrm(e.n))) s+=5; s-=Math.min(20,e.t.length);
    out.push({e,s}) });
  return out.sort((a,b)=>b.s-a.s).slice(0,limit||30).map(x=>x.e);
}

function foodWarnings(f,g){
  const w=[], n=nrm(f.n);
  if(g>2000) w.push({lvl:"bad",t:"Plus de 2 kg : vérifie la quantité."});
  else if(g>800) w.push({lvl:"warn",t:"Quantité inhabituelle : vérifie le poids."});
  if((f.state==="cru"||f.state==="sec")&&/\b(pate|pates|riz|semoule|lentille|lentilles|haricot|haricots|pois|boulgour|flocon|flocons|avoine|quinoa|nouille|nouilles|vermicelle)\b/.test(n)&&g>=150)

  return out;
}

async function decodeBarcode(file){
  const bmp=await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>rej(new Error("image illisible")); im.src=URL.createObjectURL(file) });
  if("BarcodeDetector" in window){ try{ const det=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128"]}); const r=await det.detect(bmp); if(r&&r[0]) return r[0].rawValue }catch(e){} }

async function offFetch(code){

    const j=await r.json(); clearTimeout(to); setNet(true);

    const p=j.product, n=p.nutriments||{};
    const v={kcal:num100(n,"energy-kcal_100g"),prot:num100(n,"proteins_100g"),gl:num100(n,"carbohydrates_100g"),sug:num100(n,"sugars_100g"),li:num100(n,"fat_100g"),ags:num100(n,"saturated-fat_100g"),fi:num100(n,"fiber_100g"),salt:num100(n,"salt_100g")};

/* =====================  CIRCUITS CHRONOMÉTRÉS (AMRAP)  ===================== */
if(!LIB["air-squat"]) LIB["air-squat"]=Object.assign({},LIB["squat-goblet"],{id:"air-squat",n:"Squats poids du corps",eq:"poids du corps",bw:true,rest:0});
PROGRAM.cindy={name:"Circuit Spider-Man", ico:"cal", carte:true, wod:true, dur:20, met:8,
  desc:"AMRAP 20 min : le plus de tours possible de 5 tractions, 10 pompes, 15 squats",
  amrap:{min:20, moves:[{id:"tractions",n:"Tractions",r:5},{id:"pompes",n:"Pompes",r:10},{id:"air-squat",n:"Squats",r:15}]},
  ex:[{id:"tractions",n:"Tractions",t:"5 par tour",sets:1,bw:true},{id:"pompes",n:"Pompes",t:"10 par tour",sets:1},{id:"air-squat",n:"Squats poids du corps",t:"15 par tour",sets:1}]};
PROGRAM.cindy.ex.forEach(e=>{ if(!ALL_EX[e.id]) ALL_EX[e.id]=e });
const WOD_SCALES={strictes:"Tractions strictes",elastique:"Tractions avec élastique",assistees:"Tractions machine assistée",australiennes:"Rows australiens (barre basse)"};
const WOD_COUNTDOWN=5000;

function mmss(ms,cs){ ms=Math.max(0,ms); const t=cs?Math.round(ms/100)/10:Math.round(ms/1000); const m=Math.floor(t/60), s=t-m*60; return m+":"+(s<10?"0":"")+(cs?s.toFixed(1):String(Math.floor(s))) }
function wodCfg(type){ return PROGRAM[type]&&PROGRAM[type].amrap }
function wodElapsed(w){ if(!w||!w.start) return null; const now=w.pausedAt||Date.now(); return now-w.start-(w.pausedTotal||0) }
function wodPhase(w,cfg){
  if(!w||!w.start) return "ready";
  if(w.final) return "done";
  const e=wodElapsed(w); if(e<0) return "countdown";
  if(e>=cfg.min*60000||w.stopped) return "timeup";
  return w.pausedAt?"paused":"running";
}
/* statistiques d'une tentative */
function wodStats(w,cfg){
  const total=cfg.min*60000, per=cfg.moves.reduce((a,m)=>a+m.r,0), rt=(w.rounds||[]).slice().sort((a,b)=>a-b);
  const splits=rt.map((t,i)=>t-(i?rt[i-1]:0));
  const partial=cfg.moves.reduce((a,m)=>a+Math.min(m.r,Math.max(0,num((w.partial||{})[m.id])||0)),0);
  const end=w.stopped&&w.stoppedAt!=null?Math.min(total,w.stoppedAt):total;
  const avg=splits.length?splits.reduce((a,b)=>a+b,0)/splits.length:null;
  const sd=splits.length>1?Math.sqrt(splits.reduce((a,b)=>a+(b-avg)**2,0)/splits.length):null;
  const h=Math.floor(splits.length/2), a1=h?splits.slice(0,h).reduce((a,b)=>a+b,0)/h:null, a2=h?splits.slice(splits.length-h).reduce((a,b)=>a+b,0)/h:null;
  const lastGap=end-(rt.length?rt[rt.length-1]:0);
  return {rounds:rt.length,partial,reps:rt.length*per+partial,per,splits,avg,sd,best:splits.length?Math.min(...splits):null,worst:splits.length?Math.max(...splits):null,
    first:a1,second:a2,drop:a1&&a2?(a2/a1-1)*100:null,cv:avg&&sd!=null?sd/avg*100:null,lastGap,end,
    moves:cfg.moves.map(m=>({id:m.id,n:m.n,reps:rt.length*m.r+Math.min(m.r,Math.max(0,num((w.partial||{})[m.id])||0))}))};
}
function wodHistory(type,exceptK){
  const cfg=wodCfg(type); const out=[];
  Object.keys(state.sessions).sort().forEach(k=>{ const s=state.sessions[k]; if(!s||s.type!==type||!s.wod||!s.wod.final||k===exceptK) return; out.push({k,w:s.wod,st:wodStats(s.wod,cfg)}) });
  return out;
}
function wodScore(st){ return `${st.rounds} tour${st.rounds>1?"s":""}${st.partial?" + "+st.partial+" rép.":""}` }
/* objectif de la prochaine fois, à partir des tentatives passées */
function wodTarget(type,hist){
  const cfg=wodCfg(type), total=cfg.min*60000;
  if(!hist.length) return {rounds:null,txt:"Première fois : pars à un rythme que tu peux tenir 20 minutes, pas au sprint. Note bien chaque tour, la prochaine séance s'appuiera sur ce résultat."};
  const best=hist.reduce((a,h)=>h.st.reps>a.st.reps?h:a,hist[0]), last=hist[hist.length-1];
  const tgt=best.st.rounds+1, pace=total/(tgt+0.15);
  const tips=[];
  if(last.st.drop!=null&&last.st.drop>20) tips.push(`La dernière fois, tes tours de 2e moitié étaient ${Math.round(last.st.drop)} % plus lents que ceux du début : pars un peu moins vite.`);
  else if(last.st.cv!=null&&last.st.cv<10) tips.push("Ton rythme était très régulier : garde la même stratégie et gagne quelques secondes par tour.");
  if(last.st.avg&&last.st.avg>100000) tips.push("Fractionne les tractions et les pompes dès le premier tour (par exemple 3+2 et 5+5) plutôt qu'attendre de ne plus pouvoir.");
  if(last.w.scale&&last.w.scale!=="strictes"&&last.st.rounds>=15) tips.push("Avec plus de 15 tours en version adaptée, tu peux essayer une partie des tractions en strict.");
  return {rounds:tgt,pace,best,last,txt:`Objectif : ${tgt} tours, soit un tour toutes les ${mmss(pace)} en moyenne.`,tips};
}

/* ---------- vue ---------- */
let wodTick=null;
function wodStartTick(){ if(wodTick) return; wodTick=setInterval(wodUpdate,200) }
function wodStopTick(){ if(wodTick){ clearInterval(wodTick); wodTick=null } }
function wodUpdate(){
  const s=sess(state.sel), type=s&&s.type, cfg=wodCfg(type), w=s&&s.wod;
  if(state.tab!=="seance"||!cfg||!w){ wodStopTick(); return }
  const ph=wodPhase(w,cfg); const el=document.getElementById("wod-clock");
  if(!el){ wodStopTick(); return }
  if(ph==="timeup"||ph==="done"){ wodStopTick(); keepAwake(false); render(); return }
  const e=wodElapsed(w), total=cfg.min*60000;
  if(ph==="countdown"){ el.textContent=String(Math.ceil(-e/1000)); return }
  if(el.dataset.ph==="countdown"){ render(); return }
  el.textContent=mmss(total-e);

/* ---------- dépense : MET selon la vitesse quand elle est connue (équations ACSM), sinon selon l'intensité ---------- */

    const vo2=g==="run"?3.5+0.2*v+0.9*v*grade:3.5+0.1*v+1.8*v*grade; return Math.max(g==="run"?6:3,Math.min(20,Math.round(vo2/3.5*10)/10)) }

/* ---------- moteur de chrono (continu ou fractionné) ---------- */
const C_CD=5000;
function cElapsed(L){ if(!L||!L.start) return null; return (L.pausedAt||L.stoppedAt||Date.now())-L.start-(L.pausedTotal||0) }
/* état du fractionné : phase en cours à partir des horodatages (fiable même écran verrouillé) */
function ivState(e){
  const P=e.plan, L=e.live; const el=cElapsed(L);
  if(el==null) return {ph:"ready"}; if(el<0) return {ph:"countdown",rem:-el};
  const marks=L.marks||[], skips=L.skips||[], rest=(P.rv||0)*1000;
  let s=0;
  for(let i=0;i<P.reps;i++){
    const W=P.wu==="s"?P.wv*1000:(marks[i]!=null?marks[i]-s:Infinity);
    if(el<s+W) return {ph:"work",i,since:el-s,rem:P.wu==="s"?s+W-el:null,start:s};
    const we=s+W; if(i===P.reps-1) return {ph:"end",el,end:we};
    const re=skips[i]!=null?skips[i]:we+rest;
    if(el<re) return {ph:"rest",i,rem:re-el,since:el-we};
    s=re;
  }
  return {ph:"end",el};
}
function ivReps(e){
  const P=e.plan, L=e.live||{}, marks=L.marks||[], skips=L.skips||[], rest=(P.rv||0)*1000, out=[]; let s=0; const el=cElapsed(L)||0;
  for(let i=0;i<P.reps;i++){
    const W=P.wu==="s"?P.wv*1000:(marks[i]!=null?marks[i]-s:null);
    if(W==null||s+W>el+1) break;
    out.push({i,ms:W,dist:P.wu==="m"?P.wv:((e.repDist||[])[i]||null)});
    s=skips[i]!=null?skips[i]:s+W+rest;
  }
  return out;
}
let cTick=null, cLastPh="", cAudio=null;

function cStartTick(){ if(!cTick) cTick=setInterval(cUpdate,200) }
function cStopTick(){ if(cTick){ clearInterval(cTick); cTick=null } }
function cUpdate(){

    const S=ivState(e), key=S.ph+(S.i!=null?S.i:"");
    if(key!==cLastPh){ const first=!cLastPh; cLastPh=key; if(!first){ beep(S.ph==="work"?1046:S.ph==="rest"?660:520,S.ph==="end"?600:250); render(); return } }

function allActs(days){ const out=[], from=addDays(todayKey(),-(days||365)); Object.keys(state.sessions).sort().forEach(k=>{ if(k<from) return; actsOf(k).forEach(e=>{ if(e.done) out.push({k,e}) }) }); return out }
function viewCardioStats(){

  const last4=all.filter(x=>x.k>=addDays(t,-27)&&x.e.cat==="cardio"), easy=last4.filter(x=>(x.e.rpe||0)<=4).reduce((a,x)=>a+(x.e.dur||0),0), hard=last4.filter(x=>(x.e.rpe||0)>=5).reduce((a,x)=>a+(x.e.dur||0),0), norpe=last4.filter(x=>!x.e.rpe).length;
  const longest=runs.reduce((a,x)=>!a||x.e.dist>a.e.dist?x:a,null);
  const bestOver=min=>runs.filter(x=>x.e.dist>=min&&x.e.dur).reduce((a,x)=>!a||x.e.dur/x.e.dist<a.e.dur/a.e.dist?x:a,null);
  const b5=bestOver(5), b10=bestOver(10);

function generateSession(muscles,dur,equip){
  const total={30:10,45:14,60:18,75:22}[dur]||18, W=muscles.map(m=>BIG.has(m)?1.3:.8), sw=W.reduce((a,b)=>a+b,0);
  const used=new Set(), list=[];
  muscles.forEach((m,i)=>{
    let sets=Math.max(3,Math.round(total*W[i]/sw)); const nEx=sets>=9?3:sets>=6?2:1;
    const cands=exCandidates(m,equip).filter(c=>!used.has(c.x.id));
    for(let j=0;j<nEx&&j<cands.length;j++){
      const c=cands[j]; used.add(c.x.id); const s=Math.max(2,Math.min(4,Math.round(sets/(nEx-j)))); sets-=s;
      const t=c.x.time?`${s}×30–45 s`:c.comp?`${s}×8–10`:m==="Mollets"||m==="Abdos"?`${s}×12–15`:`${s}×10–12`;
      list.push({id:c.x.id,n:c.x.n,t,sets:s,rest:c.x.rest||(c.comp?120:75),m,comp:c.comp});
    }
  });
  const order=x=>(x.comp?0:10)+(BIG.has(x.m)?0:3)+(x.m==="Abdos"?20:0);
  return list.sort((a,b)=>order(a)-order(b));
}

function createAtlas3D(THREE, dec, buf, opt){

  const camera = new THREE.PerspectiveCamera(26, 1, 0.05, 20);
  scene.add(new THREE.HemisphereLight(0xdfe8ef, 0x0f1418, 0.36));
  const key = new THREE.DirectionalLight(0xffffff, 0.58); key.position.set(-1.2, 1.6, 2.2); camera.add(key);
  const fill = new THREE.DirectionalLight(0xbcd2e0, 0.16); fill.position.set(1.8, 0.2, 1.0); camera.add(fill);
  const rim = new THREE.DirectionalLight(0x9fc4dc, 0.34); rim.position.set(0.4, 1.2, -2.5); camera.add(rim);

    return { c, sd, a, d, t, P, I };
  }

    g.setIndex(new THREE.BufferAttribute(I, 1)); g.computeVertexNormals(); g.computeBoundingSphere(); g.computeBoundingBox();

  /* ---- muscles suivis : un matériau par muscle, partagé par les deux côtés ---- */
  const mats = {}, meshes = [], byA = {}, pick = [];
  function matFor(a, vc){
    const k = a + (vc ? "#vc" : "");
    if(!mats[k]) mats[k] = new THREE.MeshStandardMaterial({ color: 0x8b949e, roughness: 0.58, metalness: 0.0, vertexColors: !!vc });

    let col = null;
    if(segs[it.a]){ // segments visuels (intersections tendineuses du grand droit)
      let y0 = 1e9, y1 = -1e9; for(let i = 1; i < it.P.length; i += 3){ y0 = Math.min(y0, it.P[i]); y1 = Math.max(y1, it.P[i]) }

      col = new Float32Array(it.P.length);
      for(let i = 0; i < it.P.length / 3; i++){ const y = it.P[i * 3 + 1]; let f = 1; cuts.forEach(cy => { const dd = Math.abs(y - cy); if(dd < w * 2.2) f = Math.min(f, 0.42 + 0.58 * (dd / (w * 2.2)) ** 1.6) }); col[i*3] = col[i*3+1] = col[i*3+2] = f }

  });

  const ctxMat = {

function atEntries(){
  const out=[], t=todayKey();
  Object.keys(state.sessions).sort().forEach(k=>{ if(k>t) return; const s=state.sessions[k]; if(!s) return;
    if(s.ex) Object.entries(s.ex).forEach(([slot,e])=>{ if(!e||e.skip) return; const id=e.alt||slot, n=doneSets(e).length; if(!n) return;
      const name=exInfo(id,e).n; atCoef(id).list.forEach(([m,l])=>out.push({k,m,l,sets:n,src:"muscu",ex:id,n:name})) });
    const cfg=s.type&&typeof wodCfg==="function"?wodCfg(s.type):null;
    if(cfg&&s.wod&&s.wod.final){ const st=wodStats(s.wod,cfg); st.moves.forEach(mv=>{ if(!mv.reps) return; const eq=Math.max(.5,Math.round(mv.reps/10*2)/2);

}

function atStats(entries,from,to){

}

  if(d.obj === "gras"){ rate = Math.min({ doux: .25, modere: .5, soutenu: .75 }[d.pace], d.weight * .01); kc = tdee - rate * 7700 / 7; protK = 2.0; steps = 9000;
    note = `déficit d'environ ${Math.round(rate * 7700 / 7)} kcal par jour pour viser ${fmt(rate, 2)} kg par semaine` }
  else if(d.obj === "muscle"){ const add = { doux: 150, modere: 250, soutenu: 400 }[d.pace]; rate = { doux: .1, modere: .2, soutenu: .35 }[d.pace]; kc = tdee + add; protK = 1.8; steps = 7000;

  try{ registerCustoms() }catch(e){}
  const k=state.sel, w=weekOf(k);
  document.getElementById("dateLabel").textContent = fmtLong.format(parseKey(k));
  document.getElementById("goToday").hidden = k===todayKey();
  const showNav = state.tab==="accueil"||state.tab==="journee"||state.tab==="jour"||state.tab==="seance";
  document.getElementById("daynav").hidden=!showNav;
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===state.tab?"page":"false"));
  app.innerHTML = state.tab==="accueil"?viewAccueil():state.tab==="journee"?viewJournee():state.tab==="jour"?viewJour():state.tab==="seance"?viewSeance():state.tab==="coach"?viewCoach():viewProfil();

function setDayField(f,v){
  const k=state.sel; const d=Object.assign({},day(k));
  if(v===""||v==null) delete d[f]; else d[f]=v;
  d.updated=Date.now();
  save("days",k,d);
}
function nSets(ex,cur){ cur=cur||{}; return cur.n!=null?cur.n:Math.max(ex.sets,(cur.sets||[]).length) }
function restLabel(sec){ const m=Math.floor(sec/60), r=sec%60; return m?(m+" min"+(r?" "+String(r).padStart(2,"0"):"")):r+" s" }

/* ---------- rest timer (silent) ---------- */
const timerEl=document.getElementById("timerbar");
let timer=null, tick=null, wake=null;
try{ const t=JSON.parse(localStorage.getItem("wa-timer")||"null"); if(t&&t.end>Date.now()-60000) timer=t }catch(e){}
function storeTimer(){ try{ timer?localStorage.setItem("wa-timer",JSON.stringify(timer)):localStorage.removeItem("wa-timer") }catch(e){} }
async function keepAwake(on){ try{ if(on&&!wake&&navigator.wakeLock){ wake=await navigator.wakeLock.request("screen"); wake.addEventListener("release",()=>{wake=null}) } else if(!on&&wake){ await wake.release(); wake=null } }catch(e){ wake=null } }
function startTimer(sec,label){ timer={end:Date.now()+sec*1000,dur:sec,label:label||"Repos"}; storeTimer(); keepAwake(true); runTimer() }
function stopTimer(){ timer=null; storeTimer(); keepAwake(false); runTimer() }
function runTimer(){
  clearInterval(tick);
  if(!timer){ timerEl.hidden=true; timerEl.querySelector(".t-ctl").hidden=true; return }
  const wasHidden=timerEl.hidden; timerEl.hidden=false; if(wasHidden) restoreTimerPos();
  const draw=()=>{
    const left=Math.ceil((timer.end-Date.now())/1000);
    if(left<=-60){ stopTimer(); return }
    const done=left<=0, a=Math.abs(left);
    timerEl.classList.toggle("done",done);
    timerEl.querySelector(".t-time").textContent=done?"Go":Math.floor(a/60)+":"+String(a%60).padStart(2,"0");
    timerEl.querySelector(".t-lbl").textContent=done?"terminé":"repos";
    const C=2*Math.PI*38, frac=done?0:Math.max(0,Math.min(1,left/timer.dur));
    const fg=timerEl.querySelector(".fg"); fg.style.strokeDasharray=C; fg.style.strokeDashoffset=C*(1-frac);
    if(done) keepAwake(false);
  };
  draw(); tick=setInterval(draw,250);
}
/* déplacement du rond : glisser pour le décaler, toucher pour les réglages */
let drag=null, dragMoved=false;
function placeTimer(x,y){
  const bw=document.body.clientWidth, bh=document.body.clientHeight, w=timerEl.offsetWidth||84, h=timerEl.offsetHeight||84;
  x=Math.max(6,Math.min(bw-w-6,x)); y=Math.max(70,Math.min(bh-h-6,y));
  timerEl.style.left=x+"px"; timerEl.style.top=y+"px"; timerEl.style.right="auto"; timerEl.style.bottom="auto";
  return {x,y};
}
function restoreTimerPos(){ try{ const p=JSON.parse(localStorage.getItem("wa-timer-pos")||"null"); if(p) placeTimer(p.x,p.y) }catch(e){} }
const ring=timerEl.querySelector(".t-ring");
ring.addEventListener("pointerdown",e=>{ const r=timerEl.getBoundingClientRect(), b=document.body.getBoundingClientRect();
  drag={dx:e.clientX-r.left, dy:e.clientY-r.top, sx:e.clientX, sy:e.clientY, bl:b.left, bt:b.top}; dragMoved=false;
  try{ ring.setPointerCapture(e.pointerId) }catch(_){} });
ring.addEventListener("pointermove",e=>{ if(!drag) return;
  if(!dragMoved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<8) return;
  dragMoved=true; ring.style.cursor="grabbing";
  placeTimer(e.clientX-drag.bl-drag.dx, e.clientY-drag.bt-drag.dy); e.preventDefault() });
const endDrag=()=>{ if(!drag) return; drag=null; ring.style.cursor="";
  if(dragMoved){ const p={x:parseFloat(timerEl.style.left),y:parseFloat(timerEl.style.top)}; try{ localStorage.setItem("wa-timer-pos",JSON.stringify(p)) }catch(e){} } };
ring.addEventListener("pointerup",endDrag); ring.addEventListener("pointercancel",endDrag);
window.addEventListener("resize",()=>{ if(timerEl.style.left) placeTimer(parseFloat(timerEl.style.left),parseFloat(timerEl.style.top)) });
timerEl.addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b||!timer) return;
  if(b.dataset.ttoggle){ if(dragMoved){ dragMoved=false; return } const c=timerEl.querySelector(".t-ctl"); timerEl.classList.toggle("below",timerEl.getBoundingClientRect().top<220); c.hidden=!c.hidden; return }
  if(b.dataset.tadd){ timer.end=Math.max(Date.now(),timer.end)+Number(b.dataset.tadd)*1000; timer.dur+=Number(b.dataset.tadd); if(timer.end<Date.now()+1000) timer.end=Date.now()+1000; storeTimer(); runTimer() }
  if(b.dataset.tstop) stopTimer();
});
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&timer){ runTimer(); if(timer.end>Date.now()) keepAwake(true) } });

const meal={sample:null,images:false,file:null,url:"",desc:"",busy:false,result:null,error:"",ctl:null};

const MEAL_ERR={not_granted:"Tu as refusé l'accès à Claude pour cette page. Rouvre l'appli pour qu'on te le redemande.",sampling_disabled:"Claude n'est pas disponible sur ce compte.",rate_limited:"Trop de demandes ou limite d'utilisation atteinte. Réessaie dans quelques minutes.",image_rejected:"Photo refusée (format ou taille). Prends-en une autre.",images_unavailable:"L'envoi de photos n'est pas disponible ici. Décris le repas en texte.",invalid_json:"Réponse illisible. Appuie à nouveau sur Analyser.",refused:"Analyse refusée pour cette photo. Décris le repas en texte.",session_expired:"Reconnecte-toi à Claude puis réessaie."};
async function analyzeMeal(){
  const descEl=document.getElementById("meal-desc"); meal.desc=descEl?descEl.value.trim():meal.desc;
  if(!meal.file&&!meal.desc){ meal.error="Ajoute une photo ou décris ton repas."; render(); return }
  meal.busy=true; meal.error=""; meal.result=null; render();
  meal.ctl=new AbortController();
  const prompt=`Tu es nutritionniste du sport. Estime les apports de ce repas ${meal.file?"(photo jointe)":""} pour un homme de ${fmt(weightAt(state.sel))} kg en recomposition corporelle (cible ${T.kcalMin}–${T.kcalMax} kcal et ${T.prot} g de protéines par jour).
${meal.desc?"Précisions de l'utilisateur : "+meal.desc+"\n":""}Identifie chaque aliment, estime sa quantité en grammes à partir des repères visuels (taille de l'assiette, couverts, emballages), puis ses calories et protéines avec des valeurs nutritionnelles standard (table Ciqual). Compte l'huile et les sauces visibles. Si un aliment est incertain, prends l'hypothèse la plus probable et dis-le.
Réponds uniquement avec ce JSON, en français :
{"repas":"nom court du repas","aliments":[{"nom":"riz blanc cuit","quantite":"200 g","kcal":260,"proteines":5,"glucides":56,"lipides":1,"fibres":1}],"kcal":0,"proteines":0,"glucides":0,"lipides":0,"fibres":0,"qualite":3,"fiabilite":"haute|moyenne|faible","remarque":"une phrase utile : hypothèse faite, ou conseil protéines"}
"qualite" : de 1 à 5 (5 = aliments peu transformés, légumes, protéines maigres ; 1 = ultra-transformé, très gras ou très sucré).`;
  try{
    const r=await meal.sample.json(prompt,{images:meal.file?[meal.file]:undefined,signal:meal.ctl.signal,cache:false});
    if(!r||!Array.isArray(r.aliments)) throw {code:"invalid_json"};
    r.kcal=Math.round(num(r.kcal)??r.aliments.reduce((a,x)=>a+(num(x.kcal)||0),0));
    r.proteines=Math.round(num(r.proteines)??r.aliments.reduce((a,x)=>a+(num(x.proteines)||0),0));
    ["glucides","lipides","fibres"].forEach(f=>{ const v=num(r[f])??r.aliments.reduce((a,x)=>a+(num(x[f])||0),0); r[f]=Math.round(v||0) });
    r.qualite=Math.max(1,Math.min(5,Math.round(num(r.qualite)||3)));
    meal.result=r;
  }catch(e){ if(e&&e.code!=="cancelled") meal.error=MEAL_ERR[e&&e.code]||"L'analyse n'a pas abouti. Réessaie." }
  meal.busy=false; render();
}

    items:r.aliments.slice(0,12).map(x=>({n:String(x.nom||"").slice(0,60),q:String(x.quantite||"").slice(0,20),kcal:Math.round(num(x.kcal)||0),prot:Math.round(num(x.proteines)||0)}))};
  d.meals=(d.meals||[]).concat([m]);
  d.kcal=String((num(d.kcal)||0)+m.kcal); d.prot=String((num(d.prot)||0)+m.prot); d.updated=Date.now();

function removeMeal(id){

}
